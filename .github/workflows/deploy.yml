name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://notifyr.grinik.pl

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Assets are built here rather than on the server: a failed build stops the deploy before
      # the server is touched, and the 1 GB droplet doesn't have to run Vite. Deployer uploads
      # public/build into the new release (see build:upload in deploy.php).
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build frontend assets
        run: npm ci && npm run build

      - name: Verify build manifest
        run: test -f public/build/manifest.json

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -p 29635 -H 64.227.122.5 >> ~/.ssh/known_hosts

      - name: Deploy with Deployer
        run: vendor/bin/dep deploy --no-interaction -vvv
